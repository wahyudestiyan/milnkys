
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokoalma_baru_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tokoalma_baru_network

  scheduler:
    image: tokoalma-baru-app
    container_name: tokoalma_baru_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tokoalma_baru_network

  nginx:
    image: nginx:alpine
    container_name: tokoalma_baru_nginx
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tokoalma_baru_network

  db:
    image: postgres:16-alpine
    container_name: tokoalma_baru_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokoalma_baru
      POSTGRES_USER: tokoalma_user
      POSTGRES_PASSWORD: tokoalmadb
    volumes:
      - tokoalma_baru_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokoalma_user -d tokoalma_baru"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tokoalma_baru_network
    
  
  mysql:
    image: mysql:8.4
    container_name: tokoalma_baru_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tokoalma_baru_mysql
      MYSQL_USER: tokoalma_mysql_user
      MYSQL_PASSWORD: "${MYSQL_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - tokoalma_baru_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tokoalma_baru_network


networks:
  tokoalma_baru_network:
    driver: bridge

volumes:
  tokoalma_baru_postgres_data:
  tokoalma_baru_mysql_data: